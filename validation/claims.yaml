# BPR-STARFIRE claims registry — literature validation loop
#
# Every claim traces to a canonical pass (A, B, C, ext) in the STARFIRE
# design record. The lit_validate.py loop checks each claim against recent
# open literature (arXiv + OSTI.gov) and flags papers for HUMAN review.
# The loop never verdicts physics — it only retrieves and grounds.
#
# status values: unverified | fresh | review
# last_checked: ISO date of last literature sweep (null = never)

_meta:
  design: BPR-STARFIRE 500 MW compact spherical tokamak, REBCO HTS, no-solenoid
  reference_point: "R0=2.10 m, a=0.95 m, kappa=2.2, delta=0.5, Bt=5.0 T (8.0 T Pass 4), Ip=10.91 MA, Pfus=500 MW, Pn=400 MW, duty 30%"
  provenance: "~/.claude/skills/starfire.md (canonical) + cad/PassA/neutronics/ in this repo"
  rule: never invent numbers — all claims must trace to a pass

claims:
  - id: TBR-TOROIDAL-REF
    statement: The toroidal no-solenoid reference blanket (45 cm W2B5 inboard shield, R0=2.10 m) achieves TBR = 1.3792 +/- 0.0007, above the 1.10 self-sufficiency threshold.
    value: 1.3792
    unit: dimensionless
    source_pass: C
    search_terms:
      - tritium breeding ratio spherical tokamak
      - lithium lead breeding blanket neutronics
      - tritium self-sufficiency fusion blanket
      - TBR PbLi blanket OpenMC
    last_checked: null
    status: unverified

